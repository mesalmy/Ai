<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>وش الروبوت</title>
<style>
:root{color-scheme:dark;--bg:#0a0f1a;--glow:#4df0ff;--mouth:#4df0ff}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
svg{width:100%;height:100%;max-height:100vh}
.eye,.mouth{filter:drop-shadow(0 0 12px var(--glow))}
.shake{animation:sh .12s infinite}
@keyframes sh{0%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}100%{transform:translate(-4px,2px)}}
#hint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#5b6b82;font:14px system-ui,sans-serif}
#bar{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;gap:16px}
#bar button{width:54px;height:54px;border-radius:50%;border:1px solid #234;background:#12203a;font-size:24px;opacity:.45;color:#fff}
#hint{padding:0 16px;box-sizing:border-box}
</style>
</head>
<body>
<svg id="face" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid meet">
  <g id="eyes">
    <g class="eye" id="eL"><rect id="rL" x="85" y="190" width="80" height="110" rx="38" fill="#4df0ff"/><path id="hL" d="M85 260 Q125 190 165 260" fill="none" stroke="#4df0ff" stroke-width="18" stroke-linecap="round" opacity="0"/></g>
    <g class="eye" id="eR"><rect id="rR" x="235" y="190" width="80" height="110" rx="38" fill="#4df0ff"/><path id="hR" d="M235 260 Q275 190 315 260" fill="none" stroke="#4df0ff" stroke-width="18" stroke-linecap="round" opacity="0"/></g>
  </g>
  <path class="mouth" id="mouth" d="M150 390 Q200 420 250 390" fill="none" stroke="#4df0ff" stroke-width="14" stroke-linecap="round"/>
</svg>
<div id="bar"><button id="gear">⚙️</button><button id="cam">👁️</button><button id="mic">🎤</button></div>
<div id="hint">المس الشاشة أو زغزغها 😄</div>
<script>
const $=id=>document.getElementById(id);
const face=$('face'),eyes=$('eyes'),mouth=$('mouth');
const rects=[$('rL'),$('rR')],arcs=[$('hL'),$('hR')];
let mood='idle',lookX=0,lookY=0,moodTimer=null;

function setMood(m,ms){
  mood=m;clearTimeout(moodTimer);
  const happy=(m==='laugh'||m==='happy');
  rects.forEach(r=>r.style.opacity=happy?0:1);
  arcs.forEach(a=>a.style.opacity=happy?1:0);
  const big=m==='surprise';
  rects.forEach(r=>{r.setAttribute('height',big?130:110);r.setAttribute('width',big?92:80)});
  const d={idle:'M150 390 Q200 420 250 390',happy:'M140 380 Q200 450 260 380',
    laugh:'M130 370 Q200 500 270 370 Z',surprise:'M180 390 Q200 440 220 390 Q200 370 180 390 Z'};
  mouth.setAttribute('d',d[m]||d.idle);
  mouth.setAttribute('fill',(m==='laugh'||m==='surprise')?'#4df0ff':'none');
  face.classList.toggle('shake',m==='laugh');
  if(ms)moodTimer=setTimeout(()=>setMood('idle'),ms);
}

function applyLook(){eyes.style.transform=`translate(${lookX}px,${lookY}px)`;eyes.style.transition='transform .12s'}

// blinking
function blink(){
  if(mood==='idle'||mood==='surprise'){
    rects.forEach(r=>{r.style.transformBox='fill-box';r.style.transformOrigin='center';r.style.transition='transform .08s';r.style.transform='scaleY(.08)'});
    setTimeout(()=>rects.forEach(r=>r.style.transform='scaleY(1)'),120);
  }
  setTimeout(blink,2000+Math.random()*3000);
}
blink();

// random looking when idle
setInterval(()=>{
  if(mood==='idle'&&!touching){lookX=(Math.random()-.5)*50;lookY=(Math.random()-.5)*30;applyLook()}
},2200);

// sound
function speak(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='ar-EG';u.rate=1.25;u.pitch=1.6;
    speechSynthesis.speak(u);
  }catch(e){}
}
function beep(f,d){
  try{
    const c=beep.c||(beep.c=new (window.AudioContext||window.webkitAudioContext)());
    const o=c.createOscillator(),g=c.createGain();
    o.frequency.value=f;o.type='sine';g.gain.value=.08;
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d);
  }catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// touch logic
let touching=false,lastX=0,lastY=0,moved=0,moveStart=0,downAt=0,laughCool=0;
function pt(e){const r=face.getBoundingClientRect();return{x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2}}
function look(e){
  const p=pt(e);
  lookX=Math.max(-30,Math.min(30,p.x/6));lookY=Math.max(-20,Math.min(20,p.y/8));applyLook();
}
face.addEventListener('pointerdown',e=>{
  touching=true;downAt=Date.now();lastX=e.clientX;lastY=e.clientY;moved=0;moveStart=Date.now();
  look(e);setMood('surprise');beep(600,.08);
});
face.addEventListener('pointermove',e=>{
  if(!touching)return;
  look(e);
  moved+=Math.hypot(e.clientX-lastX,e.clientY-lastY);lastX=e.clientX;lastY=e.clientY;
  const dt=Date.now()-moveStart;
  if(dt>1200){moved=0;moveStart=Date.now()}
  if(moved>700&&Date.now()>laughCool){ // tickle!
    laughCool=Date.now()+2500;moved=0;moveStart=Date.now();
    setMood('laugh',2500);speak('هاهاهاها بس بس بتزغزغني');buzz([60,40,60,40,60,40,60]);
  }
});
function up(){
  if(!touching)return;touching=false;
  const held=Date.now()-downAt;
  if(mood==='laugh'){/* keep laughing */}
  else if(held<300){setMood('happy',1400);beep(880,.1);}
  else setMood('happy',1500);
  lookX=0;lookY=0;applyLook();
}
face.addEventListener('pointerup',up);
face.addEventListener('pointercancel',up);

// ===== Gemini conversation =====
const MODEL='gemini-2.5-flash';
const URL_=`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
const SYS='إنت روبوت صغير ودود اسمك روبو، بتتكلم باللهجة المصرية، وردودك قصيرة جملة أو اتنين بس. لو في صورة مرفقة فدي اللي إنت شايفه قدامك من الكاميرا. ابدأ كل رد بوسم واحد بس من دول: [happy] [laugh] [surprise] [idle] حسب مشاعرك، وبعده الكلام. من غير إيموجي ولا رموز ولا تنسيق.';
const KEY='robot_gkey';let apiKey='';try{apiKey=localStorage.getItem(KEY)||''}catch(e){}
let history=[],convo=false,speaking=false,asking=false,camOn=false,stream=null,rec=null,talkTimer=null;
const vid=document.createElement('video');vid.playsInline=true;vid.muted=true;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function status(t){$('hint').textContent=t}
function setKey(){const k=prompt('حط مفتاح Gemini API بتاعك:',apiKey);if(k!==null){apiKey=k.trim();try{localStorage.setItem(KEY,apiKey)}catch(e){}}}
$('gear').onclick=setKey;

$('cam').onclick=async()=>{
  if(camOn){stream.getTracks().forEach(t=>t.stop());camOn=false;$('cam').style.opacity=.45;return}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});vid.srcObject=stream;await vid.play();camOn=true;$('cam').style.opacity=1}
  catch(e){status('الكاميرا مش شغالة: '+e.message)}
};
function frame(){
  if(!camOn||!vid.videoWidth)return null;
  const c=document.createElement('canvas');c.width=320;c.height=Math.round(vid.videoHeight*320/vid.videoWidth);
  c.getContext('2d').drawImage(vid,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.6).split(',')[1];
}
function startTalk(){stopTalk();let o=false;talkTimer=setInterval(()=>{o=!o;
  mouth.setAttribute('d',o?'M150 380 Q200 450 250 380 Z':'M150 395 Q200 410 250 395');
  mouth.setAttribute('fill',o?'#4df0ff':'none')},170)}
function stopTalk(){clearInterval(talkTimer)}

$('mic').onclick=()=>{
  if(!SR){status('المتصفح مش بيدعم التعرف على الصوت، استخدم Chrome');return}
  if(!apiKey){setKey();if(!apiKey)return}
  convo=!convo;$('mic').style.opacity=convo?1:.45;
  if(convo)listen();
  else{try{rec&&rec.abort()}catch(e){}speechSynthesis.cancel();stopTalk();speaking=false;setMood('idle');status('وقفت الحوار')}
};
function listen(){
  if(!convo||speaking||asking)return;
  rec=new SR();rec.lang='ar-EG';rec.interimResults=false;
  let got=false;
  rec.onresult=e=>{got=true;ask(e.results[0][0].transcript)};
  rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){convo=false;$('mic').style.opacity=.45;status('الميكروفون مش مسموح')}};
  rec.onend=()=>{if(convo&&!got&&!speaking&&!asking)setTimeout(listen,300)};
  try{rec.start();status('سامعك... 👂')}catch(e){}
}
async function ask(text){
  asking=true;status('بفكر... 🤔');
  history.push({role:'user',parts:[{text}]});
  const parts=[{text}];const f=frame();if(f)parts.push({inline_data:{mime_type:'image/jpeg',data:f}});
  const contents=[...history.slice(0,-1).slice(-10),{role:'user',parts}];
  try{
    const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents})});
    const j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||r.status);
    const a=j.candidates[0].content.parts.map(p=>p.text||'').join('').trim();
    history.push({role:'model',parts:[{text:a}]});
    say(a);
  }catch(e){status('خطأ: '+e.message);history.pop();asking=false;if(convo)setTimeout(listen,2000)}
}
function say(a){
  const m=a.match(/^\[(\w+)\]\s*/);let mood='happy';
  if(m){mood=m[1];a=a.slice(m[0].length)}
  if(!['happy','laugh','surprise','idle'].includes(mood))mood='happy';
  setMood(mood);
  const u=new SpeechSynthesisUtterance(a);u.lang='ar-EG';u.rate=1.05;u.pitch=1.3;
  speaking=true;asking=false;startTalk();status(a);
  u.onend=u.onerror=()=>{speaking=false;stopTalk();setMood('idle');if(convo)setTimeout(listen,400)};
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
</script>
</body>
</html>
